name: eyewear_tryon
description: "Virtual glasses try-on for Flutter with real-world sizing: PD measurement, frames drawn at true size from measurements, photos or 3D models, and a fit score."
version: 0.1.1
homepage: https://github.com/gopimani15/flutter-plugin
repository: https://github.com/gopimani15/flutter-plugin/tree/main/eyewear_tryon
issue_tracker: https://github.com/gopimani15/flutter-plugin/issues
topics:
  - virtual-try-on
  - eyewear
  - face-tracking
  - augmented-reality
  - glasses

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

flutter:
  plugin:
    platforms:
      android:
        default_package: eyewear_tryon_android
      ios:
        default_package: eyewear_tryon_ios
      web:
        default_package: eyewear_tryon_web

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  eyewear_tryon_platform_interface: ^0.1.1
  eyewear_tryon_android: ^0.1.0
  eyewear_tryon_ios: ^0.1.0
  eyewear_tryon_web: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
