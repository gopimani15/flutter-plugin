group 'dev.eyeweartryon.android'
version '0.1.0'

buildscript {
    ext.kotlin_version = '1.9.24'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'dev.eyeweartryon.android'
    compileSdk 34

    defaultConfig {
        minSdk 24
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
}

dependencies {
    // Next milestone (see TryOnPlatformView.kt):
    // implementation 'com.google.mediapipe:tasks-vision:0.10.20'
    // implementation 'androidx.camera:camera-camera2:1.3.4'
    // implementation 'androidx.camera:camera-lifecycle:1.3.4'
    // implementation 'androidx.camera:camera-view:1.3.4'
    // implementation 'com.google.android.filament:filament-android:1.54.0'
    // implementation 'com.google.android.filament:gltfio-android:1.54.0'
}
